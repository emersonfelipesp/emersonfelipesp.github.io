<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1020" viewBox="0 0 1200 1020" role="img" aria-labelledby="architecture-title architecture-desc">
  <title id="architecture-title">Emerson Felipe project architecture diagram</title>
  <desc id="architecture-desc">NetBox connects to six NetBox plugins including netbox-openbao and OpenBao for secrets, while the Proxmox suite feeds proxbox-api, netbox-sdk, proxmox-sdk, and downstream REST APIs.</desc>
  <defs>
    <style>
      .bg { fill: #07101a; }
      .frame { fill: #0c1621; stroke: #1e3247; stroke-width: 1; }
      .prompt { fill: #f5f5f5; font: 16px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .prompt-accent { fill: #00f2d4; }
      .prompt-accent-2 { fill: #ff8a1f; }
      .muted { fill: #8b9aa8; font: 13px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .connector-line { fill: none; stroke: #8b9aa8; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
      .connector-dashed { stroke-dasharray: 5 5; }
      .edge-label { fill: #8b9aa8; font: 10px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; letter-spacing: 1px; text-anchor: middle; text-transform: uppercase; }
      .svg-node rect { fill: #0c1621; stroke: #1e3247; stroke-width: 1; }
      .svg-node.node-highlight rect { stroke: rgba(0, 242, 212, 0.7); }
      .svg-node.node-featured rect { fill: rgba(0, 242, 212, 0.1); stroke: #00f2d4; }
      .node-label { fill: rgba(245, 245, 245, 0.92); font: 15px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; text-anchor: middle; }
      .node-highlight .node-label, .node-featured .node-label, .node-label-netbox { fill: #00f2d4; }
      .node-label-proxmox { fill: #ff8a1f; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="1020"></rect>
  <text class="prompt" x="48" y="48"><tspan class="prompt-accent">emerson</tspan><tspan fill="#8b9aa8">@</tspan><tspan class="prompt-accent-2">netdevops</tspan><tspan fill="#8b9aa8">:~$ </tspan><tspan>./show --architecture</tspan></text>
  <rect class="frame" x="40" y="88" width="1120" height="918"></rect>
  <text class="muted" x="64" y="124">// how my projects fit together  ·  hover any node for details</text>

  <g class="svg-node node-highlight" data-node="netbox">
    <title>netbox</title>
    <desc>Open-source source-of-truth platform for network infrastructure (DCIM / IPAM / virtualization).</desc>
    <rect x="529" y="154" width="142" height="42"></rect>
    <text class="node-label node-label-netbox" x="600" y="180">NetBox</text>
  </g>
  <text class="edge-label" x="600" y="219">plugin</text>
  <polyline class="connector-line" points="600.00,228.00 600.00,248.25"></polyline><polyline class="connector-line" points="224.70,248.25 974.40,248.25"></polyline><polyline class="connector-line" points="224.70,248.25 224.70,273.00"></polyline><polyline class="connector-line" points="375.00,248.25 375.00,273.00"></polyline><polyline class="connector-line" points="524.40,248.25 524.40,273.00"></polyline><polyline class="connector-line" points="674.70,248.25 674.70,273.00"></polyline><polyline class="connector-line" points="825.00,248.25 825.00,273.00"></polyline><polyline class="connector-line" points="974.40,248.25 974.40,273.00"></polyline><polyline class="connector-line" points="206.70,268.50 224.70,277.50 242.70,268.50"></polyline><polyline class="connector-line" points="357.00,268.50 375.00,277.50 393.00,268.50"></polyline><polyline class="connector-line" points="506.40,268.50 524.40,277.50 542.40,268.50"></polyline><polyline class="connector-line" points="656.70,268.50 674.70,277.50 692.70,268.50"></polyline><polyline class="connector-line" points="807.00,268.50 825.00,277.50 843.00,268.50"></polyline><polyline class="connector-line" points="956.40,268.50 974.40,277.50 992.40,268.50"></polyline>
  <g class="svg-node node-highlight" data-node="netbox-ceph">
    <title>netbox-ceph</title>
    <desc>NetBox plugin that syncs Proxmox Ceph storage pool and health data into NetBox.</desc>
    <rect x="160.7" y="286" width="128" height="42"></rect>
    <text class="node-label" x="224.7" y="312">netbox-ceph</text>
  </g><g class="svg-node node-highlight" data-node="netbox-pbs">
    <title>netbox-pbs</title>
    <desc>NetBox plugin that surfaces Proxmox Backup Server job history and datastore status in NetBox.</desc>
    <rect x="311" y="286" width="128" height="42"></rect>
    <text class="node-label" x="375" y="312">netbox-pbs</text>
  </g><a href="https://emersonfelipesp.com/netbox-proxbox" target="_blank"><g class="svg-node node-featured" data-node="netbox-proxbox">
    <title>netbox-proxbox</title>
    <desc>NetBox plugin that surfaces Proxmox infra (clusters, nodes, VMs, backups) inside NetBox and triggers syncs.</desc>
    <rect x="441.29999999999995" y="286" width="168" height="42"></rect>
    <text class="node-label" x="525.3" y="312">netbox-proxbox</text>
  </g></a><g class="svg-node node-highlight" data-node="netbox-pdm">
    <title>netbox-pdm</title>
    <desc>NetBox plugin that integrates Proxmox Datacenter Manager inventory and cross-cluster views into NetBox.</desc>
    <rect x="610.6999999999999" y="286" width="128" height="42"></rect>
    <text class="node-label" x="674.6999999999999" y="312">netbox-pdm</text>
  </g><g class="svg-node node-highlight" data-node="netbox-packer">
    <title>netbox-packer</title>
    <desc>NetBox plugin that tracks HashiCorp Packer build metadata and provisioned image records in NetBox.</desc>
    <rect x="749" y="286" width="152" height="42"></rect>
    <text class="node-label" x="825" y="312">netbox-packer</text>
  </g><a href="https://emersonfelipesp.com/netbox-openbao" target="_blank"><g class="svg-node node-featured" data-node="netbox-openbao">
    <title>netbox-openbao</title>
    <desc>NetBox plugin for credentials: inventory and RBAC in NetBox, secret material in OpenBao. Server-side reveal over the REST API — not browser-side vault reads.</desc>
    <rect x="891.3000000000001" y="286" width="168" height="42"></rect>
    <text class="node-label" x="975.3000000000001" y="312">netbox-openbao</text>
  </g></a>
  <polyline class="connector-line" points="974.40,344.00 974.40,389.00"></polyline><polyline class="connector-line" points="956.40,384.50 974.40,393.50 992.40,384.50"></polyline><polyline class="connector-line connector-dashed" points="974.40,389.00 974.40,407.00" opacity="0.55"></polyline><polyline class="connector-line connector-dashed" points="956.40,402.50 974.40,411.50 992.40,402.50" opacity="0.55"></polyline>
  <text class="edge-label" x="975.3000000000001" y="392">KV v2 · AppRole</text>
  <text class="edge-label" x="975.3000000000001" y="406">optional mTLS</text>
  <g class="svg-node node-highlight" data-node="openbao">
    <title>OpenBao · KV v2</title>
    <desc>OpenBao 2.6 KV v2 secret store. Holds private keys, passwords, and tokens; NetBox never stores material in PostgreSQL.</desc>
    <rect x="901.3000000000001" y="418" width="148" height="42"></rect>
    <text class="node-label" x="975.3000000000001" y="444">OpenBao · KV v2</text>
  </g>
  <g class="svg-node node-default" data-node="openbao-broker">
    <title>openbao-broker</title>
    <desc>Optional netbox-openbao-broker sidecar. Holds the AppRole; NetBox uses a client certificate to request reads.</desc>
    <rect x="891.3000000000001" y="472" width="168" height="42"></rect>
    <text class="node-label" x="975.3000000000001" y="498">openbao-broker</text>
  </g>
  <polyline class="connector-line connector-dashed" points="224.70,430.00 224.70,444.00" opacity="0.5"></polyline><polyline class="connector-line connector-dashed" points="375.00,430.00 375.00,444.00" opacity="0.5"></polyline><polyline class="connector-line connector-dashed" points="674.70,430.00 674.70,444.00" opacity="0.5"></polyline><polyline class="connector-line connector-dashed" points="825.00,430.00 825.00,444.00" opacity="0.5"></polyline><polyline class="connector-line connector-dashed" points="224.70,444.00 825.00,444.00" opacity="0.5"></polyline><polyline class="connector-line connector-dashed" points="506.40,440.00 524.40,444.00 506.40,448.00" opacity="0.5"></polyline><polyline class="connector-line connector-dashed" points="542.40,440.00 524.40,444.00 542.40,448.00" opacity="0.5"></polyline>
  <text class="edge-label" x="600" y="470">base</text>
  <polyline class="connector-line" points="224.70,482.00 224.70,502.25"></polyline><polyline class="connector-line" points="375.00,482.00 375.00,502.25"></polyline><polyline class="connector-line" points="524.40,482.00 524.40,502.25"></polyline><polyline class="connector-line" points="674.70,482.00 674.70,502.25"></polyline><polyline class="connector-line" points="825.00,482.00 825.00,502.25"></polyline><polyline class="connector-line" points="224.70,502.25 825.00,502.25"></polyline><polyline class="connector-line" points="600.00,502.25 600.00,527.00"></polyline><polyline class="connector-line" points="582.00,522.50 600.00,531.50 618.00,522.50"></polyline>
  <text class="edge-label" x="600" y="546">HTTP / SSE / WS</text>
  <g class="svg-node node-highlight" data-node="proxbox-api">
    <title>proxbox-api</title>
    <desc>FastAPI backend that orchestrates the NetBox ↔ Proxmox sync workflow over HTTP, SSE, and WebSocket.</desc>
    <rect x="536" y="562" width="128" height="42"></rect>
    <text class="node-label" x="600" y="588">proxbox-api</text>
  </g>
  <polyline class="connector-line" points="600.00,628.00 600.00,648.25"></polyline><polyline class="connector-line" points="366.00,648.25 834.00,648.25"></polyline><polyline class="connector-line" points="366.00,648.25 366.00,673.00"></polyline><polyline class="connector-line" points="834.00,648.25 834.00,673.00"></polyline><polyline class="connector-line" points="348.00,668.50 366.00,677.50 384.00,668.50"></polyline><polyline class="connector-line" points="816.00,668.50 834.00,677.50 852.00,668.50"></polyline>

  <a href="https://emersonfelipesp.com/netbox-sdk" target="_blank"><g class="svg-node node-highlight" data-node="netbox-sdk">
    <title>netbox-sdk</title>
    <desc>Python async SDK + CLI (nbx) + Textual TUI for the NetBox REST API. Used by proxbox-api to read/write NetBox.</desc>
    <rect x="302" y="696" width="128" height="42"></rect>
    <text class="node-label" x="366" y="722">netbox-sdk</text>
  </g></a>
