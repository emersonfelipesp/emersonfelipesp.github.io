    <polyline class="connector-line" points="361,787 366,798 371,787"></polyline>
  </g>
  <g class="svg-node node-default" data-node="netbox-rest">
    <title>netbox · REST API</title>
    <desc>NetBox&#39;s REST API — the data target where Proxmox infrastructure ends up.</desc>
    <rect x="274" y="810" width="184" height="42"></rect>
    <text class="node-label node-label-netbox" x="366" y="836">NetBox · REST API</text>
  </g>

